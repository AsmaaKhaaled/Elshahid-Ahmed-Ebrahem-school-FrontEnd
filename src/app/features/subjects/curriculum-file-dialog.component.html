<div appPortalToBody dir="rtl" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-2 sm:p-4 font-cairo">
  <form #form="ngForm" (ngSubmit)="save(form)" novalidate [appSubmitLock]="lock.busy()"
    class="bg-white rounded-3xl shadow-2xl max-w-lg w-full max-h-full overflow-y-auto p-4 sm:p-6 space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <h3 class="font-black text-slate-800 text-lg">رفع ملف منهج</h3>
      <button (click)="closed.emit()" type="button" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>

    <mat-form-field class="w-full">
      <mat-label>نوع الملف</mat-label>
      <mat-select name="kind" required [ngModel]="kind" (ngModelChange)="selectKind($event)">
        @for (k of kinds; track k.id) {
          <mat-option [value]="k.id">{{ k.icon }} {{ k.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="space-y-2">
      <label class="inline-block px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold text-xs text-slate-700 cursor-pointer transition-colors">
        📎 {{ file ? 'تغيير الملف' : 'اختيار الملف (PDF، Word، صور...)' }}
        <input type="file" class="hidden" [accept]="accept" (change)="onFileSelected($event)" />
      </label>
      <p class="text-[11px] text-slate-400">حتى {{ maxMb }} ميجا</p>
      @if (file) {
        <app-teaching-files [files]="[file]" />
      }
      @if (fileError()) {
        <p class="text-xs text-rose-600 font-semibold">{{ fileError() }}</p>
      }
    </div>

    <mat-form-field class="w-full">
      <mat-label>العنوان</mat-label>
      <input matInput name="title" required maxlength="120" [(ngModel)]="title" placeholder="مثال: كتاب الوزارة - الترم الأول" />
      <mat-error>العنوان مطلوب</mat-error>
    </mat-form-field>

    <label class="flex items-start gap-2 text-sm text-slate-700 cursor-pointer">
      <input type="checkbox" name="forStudents" [(ngModel)]="forStudents" class="mt-1 w-4 h-4 rounded accent-primary-700" />
      <span>
        <span class="font-bold">يظهر للطلاب</span>
        <span class="block text-[11px] text-slate-500">لو شلت العلامة الملف هيبقى ليك انت بس (زي دليل المعلم)</span>
      </span>
    </label>

    <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
      <button (click)="closed.emit()" type="button" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-bold text-xs">إلغاء</button>
      <button type="submit" [disabled]="lock.busy()" class="px-5 py-2 rounded-xl bg-primary-800 text-white font-bold text-xs hover:bg-primary-900 shadow disabled:opacity-60">
        رفع الملف
      </button>
    </div>
  </form>
</div>
